<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Altnautica">
  <style>.ground{fill:#F8FAFC}.aircraft{stroke:#DFF140}@media (prefers-color-scheme: light){.ground{fill:#0F172A}.aircraft{stroke:#4D7C0F}}</style>
  <defs>
    <clipPath id="fv-disc"><circle cx="50" cy="50" r="42"/></clipPath>
    <mask id="fv-knock" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff"/>
      <path d="M28,50 H42 L50,56 L58,50 H72" fill="none" stroke="#000" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>
  <g clip-path="url(#fv-disc)" mask="url(#fv-knock)"><g class="ground" fill="#F8FAFC"><rect x="-50" y="50" width="200" height="100" transform="rotate(-8 50 50)"/></g></g>
  <path class="aircraft" d="M28,50 H42 L50,56 L58,50 H72" fill="none" stroke="#DFF140" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
