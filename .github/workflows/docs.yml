name: docs

on:
  pull_request:

permissions:
  contents: read

jobs:
  broken-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check internal links
        run: npx -y mint@4.2.994 broken-links
