name: Bump reference sources

# Re-pin reference-sources.json to each source repo's current main, regenerate
# the snippets, and open a pull request with the result.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pin each source to main
        run: |
          set -euo pipefail
          for repo in ADOSDroneAgent ADOSMissionControl ADOSExtensions; do
            sha="$(git ls-remote "https://github.com/altnautica/${repo}" refs/heads/main | cut -f1)"
            test -n "$sha"
            node -e 'const fs=require("fs");const [r,s]=process.argv.slice(1);const p="reference-sources.json";const j=JSON.parse(fs.readFileSync(p,"utf8"));j[r]=s;fs.writeFileSync(p,JSON.stringify(j,null,2)+"\n");' "$repo" "$sha"
          done

      - name: Regenerate
        run: node scripts/gen-reference.mjs

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- reference-sources.json snippets/generated; then
            echo "already current"
            exit 0
          fi
          branch="bump-reference-sources-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add reference-sources.json snippets/generated
          git commit -m "Update generated reference snippets"
          git push origin "$branch"
          gh pr create --title "Update generated reference snippets" --body "Re-pins reference-sources.json to each source repo's main and regenerates snippets/generated." --base main --head "$branch"
